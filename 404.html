<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — Santi Rosina</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#171310">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: linear-gradient(180deg, #1e1914, #171310);
      color: #f1e9db;
      font-family: "Jost", "Century Gothic", Futura, sans-serif;
      font-weight: 300;
      padding: 2rem;
    }
    .mark { width: 88px; height: 88px; margin: 0 auto 2rem; }
    h1 {
      font-family: "Bodoni Moda", "Bodoni MT", Didot, "Times New Roman", serif;
      font-weight: 500;
      font-size: clamp(2.2rem, 8vw, 3.6rem);
      line-height: 1.1;
      margin: 0 0 1rem;
    }
    p { color: rgba(241, 233, 219, 0.72); margin: 0 0 2.4rem; line-height: 1.7; }
    .rule {
      width: 128px; height: 7px; margin: 1.8rem auto;
      border-top: 1px solid rgba(194, 162, 101, 0.55);
      border-bottom: 1px solid rgba(194, 162, 101, 0.28);
    }
    a.btn {
      display: inline-block;
      font-size: 0.76rem;
      font-weight: 500;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      text-decoration: none;
      color: #f1e9db;
      border: 1px solid rgba(194, 162, 101, 0.55);
      padding: 1.05em 2.5em 0.95em;
      transition: background-color 0.35s ease, color 0.35s ease;
    }
    a.btn:hover { background: #c2a265; color: #171310; }
  </style>
</head>
<body>
  <div>
    <svg class="mark" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="30" fill="none" stroke="#C2A265" stroke-width="1.4"/><circle cx="32" cy="32" r="25.5" fill="none" stroke="#C2A265" stroke-width="0.7" opacity="0.55"/><text x="32" y="40.5" text-anchor="middle" font-family="Bodoni Moda, Didot, serif" font-size="21" letter-spacing="1" fill="#F1E9DB">SR</text></svg>
    <h1>Lost among the vines</h1>
    <div class="rule"></div>
    <p>The page you're after isn't here.<br>The cellar door, however, is always open.</p>
    <a class="btn" id="home" href="/">Back to the house</a>
  </div>
  <script>
    // On the github.io preview the site lives under /santirosina/
    if (location.hostname.endsWith("github.io")) {
      document.getElementById("home").href = "/santirosina/";
    }
  </script>
</body>
</html>
