name: Cycling training note

# Redrafts assets/data/cycling-brief.json on demand. The note is normally
# written by the Cycling rides workflow, in the job that pulls the rides,
# each time a new ride is added; this workflow is the manual path — use it
# after changing the prompt, or to redraft without waiting for a ride.
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: cycling-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: scripts
        run: npm install --no-fund --no-audit
      - name: Generate the note
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/cycling-brief.mjs
      - name: Commit if changed
        run: |
          git add assets/data/cycling-brief.json
          # staged diff — a plain diff misses the file when it is brand-new
          if git diff --cached --quiet; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update cycling training note"
          # the rides workflow may have pushed meanwhile
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
