name: Fishing bluefin brief

# Drafts the note under the fishing page's title each morning: a bluefin
# call for today and tomorrow, from the NWS coastal waters forecast and the
# Open-Meteo wind / wave / SST model at the chart's grounds.
on:
  schedule:
    - cron: "45 12 * * *" # ~5:45 AM Pacific, daily
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fishing-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: scripts
        run: npm install --no-fund --no-audit
      - name: Generate the brief
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/fishing-brief.mjs
      - name: Commit if changed
        run: |
          git add assets/data/fishing-brief.json
          # staged diff — a plain diff misses the file when it is brand-new
          if git diff --cached --quiet; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update fishing bluefin brief"
          # the cycling workflows may have pushed meanwhile
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
