name: Fishing weekend brief

on:
  schedule:
    - cron: "45 13 * * *" # ~6:45 AM Pacific, daily
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fishing-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: scripts
        run: npm install --no-fund --no-audit
      - name: Generate the brief
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/fishing-brief.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet -- assets/data/fishing-brief.json; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/fishing-brief.json
          git commit -m "Update fishing weekend brief"
          git push
